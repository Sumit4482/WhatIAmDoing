services:
  - type: web
    name: sumit-dashboard-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    nodeVersion: 18
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_PATH
        value: /opt/render/project/src/data/dashboard.db
    disk:
      name: dashboard-db
      mountPath: /opt/render/project/src/data
      sizeGB: 1
