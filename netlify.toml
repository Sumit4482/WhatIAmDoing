[build]
  base = "web"
  publish = "dist"
  command = "rm -rf node_modules package-lock.json && npm install --legacy-peer-deps --no-workspaces && npm install @rollup/rollup-linux-x64-gnu --save-optional --legacy-peer-deps && npm run build"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
